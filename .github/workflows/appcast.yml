name: Update appcast

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)generate an appcast item for"
        required: true
        type: string

# Two releases published back to back would otherwise race on the same file.
concurrency:
  group: appcast
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Match the Sparkle version your app links against.
  SPARKLE_VERSION: "2.7.1"
  # Branch that GitHub Pages serves from. A release event checks out the tag,
  # so the branch has to be named explicitly.
  TARGET_BRANCH: main
  APPCAST_PATH: docs/appcast.xml

jobs:
  appcast:
    # generate_appcast is a macOS binary.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::no tag to work with"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p updates
          # gh exits non-zero when a pattern matches nothing, so check the
          # directory afterwards rather than trusting the exit code.
          gh release download "$TAG" --dir updates \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.tar.xz' || true
          if [ -z "$(ls -A updates)" ]; then
            echo "::error::no distributable assets attached to $TAG"
            exit 1
          fi
          ls -la updates

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # generate_appcast picks up <archive-basename>.html as the item's
          # <description>, so render the release body once and copy it per archive.
          BODY="$(gh release view "$TAG" --json body --jq .body)"
          if [ -z "$BODY" ]; then
            echo "no release body for $TAG, skipping notes"
            exit 0
          fi
          gh api -X POST /markdown -f mode=gfm -f text="$BODY" > /tmp/notes.html
          for archive in updates/*; do
            base="$(basename "$archive")"
            case "$base" in
              *.tar.xz) stem="${base%.tar.xz}" ;;
              *.dmg|*.zip) stem="${base%.*}" ;;
              *) continue ;;
            esac
            cp /tmp/notes.html "updates/${stem}.html"
          done

      - name: Fetch Sparkle tools
        run: |
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle
          tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle

      - name: Generate appcast for this release
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set"
            exit 1
          fi
          # --download-url-prefix applies to every archive in the run, which is
          # why only one tag's assets are processed at a time.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            -o /tmp/generated-appcast.xml \
            updates/
          cat /tmp/generated-appcast.xml

      - name: Merge into the published appcast
        run: |
          mkdir -p "$(dirname "$APPCAST_PATH")"
          python3 scripts/merge_appcast.py \
            "$APPCAST_PATH" /tmp/generated-appcast.xml /tmp/merged-appcast.xml
          mv /tmp/merged-appcast.xml "$APPCAST_PATH"
          touch "$(dirname "$APPCAST_PATH")/.nojekyll"

      - name: Commit and push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$APPCAST_PATH" "$(dirname "$APPCAST_PATH")/.nojekyll"
          if git diff --staged --quiet; then
            echo "appcast unchanged"
            exit 0
          fi
          git commit -m "chore(appcast): publish ${TAG}"
          # Another run may have pushed while this one was building.
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
